name: coverage
on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  coverage:
    runs-on: l3-ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Coverage and race tests
        run: go test -race -timeout 5m -covermode=atomic -coverprofile=coverage.txt ./...
      - uses: codecov/codecov-action@v6
        with:
          files: ./coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}
