name: module checks
on:
  workflow_call:
    inputs:
      go-version:
        type: string
        default: stable
      go-version-file:
        type: string
        default: ""
      working-directory:
        type: string
        default: .
permissions:
  contents: read
jobs:
  build:
    runs-on: l3-ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version-file }}
          cache-dependency-path: '**/go.sum'
      - name: Check module tidiness
        run: |
          go mod tidy
          git diff --exit-code
      - name: Build
        run: go build ./...
      - name: Linux tests
        run: go test -timeout 5m ./...
      - name: Linux race tests
        run: go test -race -timeout 5m ./...
  govulncheck:
    runs-on: l3-ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file || 'go.mod' }}
          cache-dependency-path: '**/go.sum'
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
  cross-compile:
    name: compile Darwin and Windows targets (no execution)
    runs-on: l3-ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version-file }}
          cache-dependency-path: '**/go.sum'
      - name: Cross-build packages and test binaries without execution
        # Go compiles every test binary, then the explicit executor returns without running it.
        run: |
          for target in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "Compile $target (no execution)"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./...
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go test -run '^$' -exec /bin/true ./...
          done
