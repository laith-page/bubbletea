name: lint
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  lint:
    uses: charmbracelet/meta/.github/workflows/lint.yml@main
    with:
      os: ${{ vars.CI_PROVIDER == 'namespace' && '["nscloud-ubuntu-26.04-amd64-4x16", "macos-latest", "windows-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]' }}
      golangci_path: .golangci.yml
      golangci_version: v2.9
      timeout: 10m
