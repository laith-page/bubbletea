name: build
on: [push, pull_request]

jobs:
  build:
    uses: ./.github/workflows/upstream-build.yml
    with:
      linux-runner: ${{ vars.CI_PROVIDER == 'namespace' && 'nscloud-ubuntu-26.04-amd64-4x16' || 'ubuntu-latest' }}

  build-go-mod:
    uses: ./.github/workflows/upstream-build.yml
    with:
      linux-runner: ${{ vars.CI_PROVIDER == 'namespace' && 'nscloud-ubuntu-26.04-amd64-4x16' || 'ubuntu-latest' }}
      go-version: ""
      go-version-file: ./go.mod

  build-examples:
    if: github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/upstream-build.yml
    with:
      linux-runner: ${{ vars.CI_PROVIDER == 'namespace' && 'nscloud-ubuntu-26.04-amd64-4x16' || 'ubuntu-latest' }}
      go-version: ""
      go-version-file: ./examples/go.mod
      working-directory: ./examples
